plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '0.7.3'
}

group 'cn.gudqs7.idea.plugins'
version '2.6.2'

repositories {
    mavenLocal()
    maven { url "https://maven.aliyun.com/repository/public" }
    mavenCentral()
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'

    implementation 'org.freemarker:freemarker:2.3.31'
    implementation 'com.youbenzi:MDTool:1.2.4'
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    implementation 'commons-collections:commons-collections:3.2.2'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'commons-codec:commons-codec:1.17.1'
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'com.google.code.gson:gson:2.11.0'

    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.15.2'
    implementation 'com.fasterxml.jackson.module:jackson-module-parameter-names:2.15.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.15.2'
    implementation 'org.yaml:snakeyaml:2.0'

}

// See https://github.com/JetBrains/gradle-intellij-plugin/
intellij {
    version = '2021.1.1'
    downloadSources = false
    updateSinceUntilBuild = false
    buildSearchableOptions.enabled = false
    plugins = ['com.intellij.java', 'org.nik.presentation-assistant:1.0.8']
}

// study from https://github.com/liuzhihang/doc-view/blob/master/build.gradle
patchPluginXml {
    pluginDescription = file(descriptionFile).text
    changeNotes = file(changesFile).text
}
test {
    useJUnitPlatform()
}

publishPlugin {
    channels = ''
    token = System.getenv("JET_PUB_TOKEN")
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 11
}

tasks.register('verifyPluginRuntimeLibraries') {
    dependsOn buildPlugin

    doLast {
        def pluginZip = file("$buildDir/distributions/${project.name}-${project.version}.zip")
        def jarNames = zipTree(pluginZip).matching {
            include "${project.name}/lib/*.jar"
        }.files*.name as Set
        def expectedJars = [
                'commons-collections-3.2.2.jar',
                'commons-lang3-3.14.0.jar',
                'commons-codec-1.17.1.jar',
                'commons-io-2.16.1.jar',
                'gson-2.11.0.jar',
                'freemarker-2.3.31.jar',
                'MDTool-1.2.4.jar',
                'jackson-annotations-2.15.2.jar',
                'jackson-core-2.15.2.jar',
                'jackson-databind-2.15.2.jar',
                'jackson-datatype-jdk8-2.15.2.jar',
                'jackson-datatype-jsr310-2.15.2.jar',
                'jackson-module-parameter-names-2.15.2.jar',
                'jackson-dataformat-yaml-2.15.2.jar',
                'snakeyaml-2.0.jar'
        ]

        assert jarNames.containsAll(expectedJars): "Missing plugin runtime libraries: ${expectedJars - jarNames}"
    }
}

check.dependsOn tasks.named('verifyPluginRuntimeLibraries')
